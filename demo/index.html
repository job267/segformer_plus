<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>街景分割 · SegFormer</title>
<style>
[hidden]{display:none!important}
:root{font-family:Segoe UI,Microsoft YaHei,system-ui,sans-serif;color:#203040;background:#f1f5f6;font-size:15px}*{box-sizing:border-box}body{margin:0}header{background:#102f35;color:#eef7f5;padding:32px max(28px,calc((100vw - 1280px)/2));border-bottom:4px solid #36b7a2}header p{margin:8px 0;color:#bdd6d3}h1{font-size:30px;font-weight:650;margin:0;letter-spacing:.03em}main{max-width:1336px;margin:auto;padding:28px;display:grid;grid-template-columns:284px 1fr;gap:24px}aside,.workspace{background:white;border:1px solid #dce5e7;border-radius:12px;padding:22px}h2{font-size:17px;margin:0 0 18px}label{display:block;font-size:13px;font-weight:650;margin:20px 0 8px}select,input{font:inherit;width:100%;border:1px solid #cbd7db;border-radius:7px;padding:10px;background:white}input[type=file]{font-size:12px;padding:9px}button{font:inherit;border:0;border-radius:7px;padding:11px 14px;cursor:pointer;font-weight:600}button.primary{width:100%;background:#087e70;color:white;margin-top:24px}button.secondary{background:#eaf3f1;color:#14675e;width:100%;margin-top:10px}button:disabled{opacity:.5;cursor:wait}.hint{font-size:12px;line-height:1.7;color:#647880;margin:14px 0}.status{min-height:44px;font-size:13px;line-height:1.6;margin:16px 0 0;color:#416167}.status.error{color:#b13339}.topline{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.badge{font-size:12px;background:#e9f4f1;color:#147567;border-radius:30px;padding:6px 12px}.topline h2{margin:0}.preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}figure{margin:0;background:#f8fafb;border:1px solid #e1e8ea;border-radius:9px;overflow:hidden;min-width:0}.empty{height:260px;display:grid;place-items:center;color:#93a3a9;font-size:14px;padding:20px;text-align:center}figure img{width:100%;display:none;object-fit:contain;max-height:440px;background:#eef2f3}figcaption{padding:12px 14px;font-size:13px;font-weight:600;border-top:1px solid #e1e8ea}.result-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid #e1e8ea}.time{font-size:13px;color:#3e6267}.downloads{display:flex;gap:12px}.downloads a{font-size:13px;color:#087e70;text-decoration:none;border-bottom:1px solid #9fcac3}.legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:18px;font-size:12px;color:#526a72}.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}footer{max-width:1280px;margin:0 auto 24px;padding:0 28px;color:#76898e;font-size:12px}@media(max-width:900px){main{grid-template-columns:1fr;padding:18px}header{padding:26px}aside{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}aside h2,aside .hint,aside .status{grid-column:1/-1}label{margin-top:8px}button.primary{margin-top:8px}}@media(max-width:600px){.preview-grid,aside{display:block}figure{margin-bottom:14px}select,input{margin-bottom:12px}.empty{height:180px}h1{font-size:24px}}
</style></head><body>
<header><h1>街景语义分割</h1><p>SegFormer-B0 · CamVid 11 类 · 本地离线演示</p></header>
<main><aside><h2>预测设置</h2><div><label for="file">上传图片</label><input id="file" type="file" accept="image/*"><button id="example" class="secondary">载入示例</button></div><div><label for="model">选择模型</label><select id="model" aria-label="选择模型"></select><label for="precision">推理精度</label><select id="precision"><option value="fp32">FP32 · 默认</option><option value="fp16">FP16 · CUDA autocast</option></select><button id="predict" class="primary" disabled>开始分割</button></div><p class="hint">输出与原图尺寸一致。类别索引图保存 0–10 的类别编号。首次预测需要加载所选模型。</p><p id="status" class="status" role="status">正在连接本地模型…</p></aside>
<section class="workspace"><div class="topline"><h2>预测预览</h2><span id="device" class="badge">本地运行</span></div><div class="preview-grid"><figure><div id="input-empty" class="empty">上传图片或载入示例，开始查看分割结果</div><img id="input-preview" alt="输入图片"><figcaption>输入图片</figcaption></figure><figure><div id="output-empty" class="empty">叠加结果将在这里显示</div><img id="output-preview" alt="分割叠加结果"><figcaption>分割叠加结果</figcaption></figure></div><div id="result-row" class="result-row" hidden><span id="timing" class="time"></span><div class="downloads"><a id="download-color" download="segmentation.png">下载彩色图</a><a id="download-overlay" download="overlay.png">下载叠加图</a><a id="download-index" download="index.png">下载类别索引图</a></div></div><div id="legend" class="legend"></div></section></main>
<footer>页面展示单图预测，不计算该图片的 mIoU。示例来自 CamVid 验证集；模型对照与完整精度见<a href="/report/final_report.html" target="_blank" rel="noopener">课程报告</a>。</footer>
<script>
const byId=id=>document.getElementById(id);let imageData=null,busy=false;
function lockControls(locked){for(const id of ['file','example','model','precision'])byId(id).disabled=locked;byId('predict').disabled=locked||!imageData||!byId('model').value;}
function status(message,error=false){byId('status').textContent=message;byId('status').className='status'+(error?' error':'');}
function setImage(url){imageData=url.split(',')[1];byId('input-preview').src=url;byId('input-preview').style.display='block';byId('input-empty').hidden=true;byId('output-preview').style.display='none';byId('output-empty').hidden=false;byId('result-row').hidden=true;byId('legend').replaceChildren();byId('predict').disabled=!imageData||busy||!byId('model').value;}
byId('file').addEventListener('change',()=>{const file=byId('file').files[0];if(!file)return;if(file.size>16*1024*1024){status('请选择小于 16 MiB 的图片',true);return;}const reader=new FileReader();reader.onload=()=>{setImage(reader.result);status('图片已就绪，可开始分割。');};reader.readAsDataURL(file);});
byId('example').addEventListener('click',async()=>{try{const response=await fetch('/api/example');const data=await response.json();if(!response.ok)throw new Error(data.error);setImage(data.image);status('已载入 CamVid 验证集示例。');}catch(error){status(error.message,true);}});
byId('predict').addEventListener('click',async()=>{if(!imageData||busy)return;busy=true;lockControls(true);byId('predict').textContent='正在分割…';status('正在加载模型并预测，请稍候。');try{const response=await fetch('/api/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:byId('model').value,precision:byId('precision').value,image:imageData})});const data=await response.json();if(!response.ok)throw new Error(data.error);byId('output-preview').src=data.overlay;byId('output-preview').style.display='block';byId('output-empty').hidden=true;byId('result-row').hidden=false;byId('timing').textContent=`${data.model} · ${data.width}×${data.height} · 图片流程 ${data.pipeline_ms.toFixed(1)} ms`;byId('timing').title=data.timing_scope;byId('download-color').href=data.segmentation;byId('download-overlay').href=data.overlay;byId('download-index').href=data.index_mask;byId('legend').replaceChildren(...data.classes.map(item=>{const span=document.createElement('span'),swatch=document.createElement('i');swatch.style.background=`rgb(${item.color.join(',')})`;span.append(swatch,document.createTextNode(item.name));return span;}));status('预测完成，可下载彩色图、叠加图和类别索引图。');}catch(error){status(error.message,true);}finally{busy=false;lockControls(false);byId('predict').textContent='开始分割';}});
fetch('/api/status').then(response=>response.json()).then(data=>{byId('model').replaceChildren(...data.models.map(item=>{const option=document.createElement('option');option.value=item.id;option.textContent=`${item.id} · ${item.label}`;option.disabled=!item.available;return option;}));const firstModel=data.models.find(item=>item.available);byId('model').value=firstModel?.id||'';byId('precision').options[1].disabled=!data.fp16_available;byId('device').textContent=data.device==='cuda'?'CUDA · 本地 GPU':'CPU · 本地';status(firstModel?'模型已就绪，请上传图片或载入示例。':'未找到本地权重，请使用完整提交包或完成训练。',!firstModel);}).catch(()=>status('无法连接服务，请检查本地演示是否已启动。',true));
</script></body></html>

experiment_id: E0_baseline
seed: 42
device: auto
output_dir: results/E0_baseline

model:
  checkpoint: nvidia/mit-b0
  revision: 80983a413c30d36a39c20203974ae7807835e2b4
  local_files_only: false
  num_labels: 11
  do_reduce_labels: false

dataset:
  root: data/CamVid
  source: https://github.com/lih627/CamVid
  source_revision: 79ae0071a75d90331a62b5a2aaf6d53cc69fd9f6
  splits:
    train: camvid_train.txt
    val: camvid_val.txt
    test: camvid_test.txt
  label_encoding: index
  ignore_index: 255
  # Reference counts are checked against files, never treated as audited facts.
  expected_counts:
    train: 367
    val: 101
    test: 233

preprocessing:
  size: [384, 384]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

augmentation:
  enabled: false
  horizontal_flip_probability: 0.5
  brightness: 0.2
  contrast: 0.2
  saturation: 0.2

training:
  batch_size: 4
  epochs: 50
  learning_rate: 0.00006
  weight_decay: 0.01
  amp: true
  num_workers: 0
  loss: ce
  dice_weight: 0.5
